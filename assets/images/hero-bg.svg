<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e3a5f" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <radialGradient id="glow1" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="900" fill="#0f172a"/>
  <rect width="1440" height="900" fill="url(#grid)"/>
  <rect width="1440" height="900" fill="url(#glow1)"/>
  <rect width="1440" height="900" fill="url(#glow2)"/>
  <!-- Floating dots -->
  <circle cx="120" cy="180" r="2" fill="#3b82f6" opacity="0.7"/>
  <circle cx="340" cy="90" r="1.5" fill="#6366f1" opacity="0.6"/>
  <circle cx="700" cy="200" r="2.5" fill="#3b82f6" opacity="0.5"/>
  <circle cx="1050" cy="130" r="2" fill="#8b5cf6" opacity="0.7"/>
  <circle cx="1280" cy="300" r="1.5" fill="#3b82f6" opacity="0.5"/>
  <circle cx="900" cy="400" r="2" fill="#6366f1" opacity="0.4"/>
  <circle cx="200" cy="500" r="1.5" fill="#3b82f6" opacity="0.5"/>
  <circle cx="1380" cy="500" r="2" fill="#8b5cf6" opacity="0.6"/>
  <!-- Accent line -->
  <line x1="0" y1="898" x2="1440" y2="898" stroke="#1e3a5f" stroke-width="1"/>
</svg>
